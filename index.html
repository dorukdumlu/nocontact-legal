<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NoContact · Legal</title>
  <meta name="description" content="Privacy policy and terms of service for the NoContact app." />
  <style>
    :root {
      --bg: #0a0514;
      --panel: #120824;
      --text: #e9e5f5;
      --muted: #9a93b6;
      --accent: #a78bfa;
      --border: rgba(255,255,255,0.08);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .card {
      max-width: 480px;
      width: calc(100% - 48px);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px;
      text-align: center;
    }
    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      border-radius: 18px;
      background: linear-gradient(140deg, #a78bfa 0%, #7c3aed 100%);
      display: grid;
      place-items: center;
      font-size: 30px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 28px;
      letter-spacing: -0.02em;
      font-weight: 800;
    }
    .sub { color: var(--muted); margin: 0 0 28px; font-size: 14px; }
    .links {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }
    .links a {
      display: block;
      padding: 14px 18px;
      border-radius: 12px;
      background: rgba(167,139,250,0.08);
      border: 1px solid rgba(167,139,250,0.2);
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      transition: background .15s ease;
    }
    .links a:hover { background: rgba(167,139,250,0.16); }
    .hint { color: var(--muted); font-size: 12px; margin-top: 24px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">💜</div>
    <h1>NoContact</h1>
    <p class="sub">Legal pages for the NoContact app.</p>
    <nav class="links">
      <a href="./privacy-policy.html">Privacy Policy</a>
      <a href="./terms.html">Terms of Service</a>
    </nav>
    <p class="hint">Get the app on Google Play.</p>
  </main>
</body>
</html>
